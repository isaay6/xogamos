services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ${XOGAMOS_IMAGE:-ghcr.io/isaay6/xogamos}:${XOGAMOS_VERSION:-latest}
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      IDENTITY_MODE: ${IDENTITY_MODE}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-x-forwarded-proto}
      ADDRESS_HEADER: ${ADDRESS_HEADER:-x-forwarded-for}
      XFF_DEPTH: ${XFF_DEPTH:-1}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-512K}
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM}
      DEMO: ${DEMO}
      DEMO_DATABASE_IS_DISPOSABLE: ${DEMO_DATABASE_IS_DISPOSABLE}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  seed:
    build:
      context: .
      target: seed
    profiles: ["demo"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Europe/Madrid
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    command: ["sh", "/usr/local/bin/backup-loop.sh"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      XOGAMOS_DOMAIN: ${XOGAMOS_DOMAIN}
      XOGAMOS_EMAIL: ${XOGAMOS_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
