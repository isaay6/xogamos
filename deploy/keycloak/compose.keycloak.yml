services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-demo-only
    volumes:
      - ./realm-xogamos.json:/opt/keycloak/data/import/realm-xogamos.json:ro
      - ./realm-clave-simulado.json:/opt/keycloak/data/import/realm-clave-simulado.json:ro
